<h2 mat-dialog-title>{{ isEdit ? 'Sửa vai trò' : 'Tạo vai trò' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Tên vai trò</mat-label>
      <input matInput formControlName="name" placeholder="VD: Quản trị viên" />
      <mat-icon matPrefix>label</mat-icon>
      @if (form.controls.name.hasError('required') && form.controls.name.touched) {
        <mat-error>Bắt buộc</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Mô tả</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton (click)="cancel()">Hủy</button>
  <button [matButton]="'filled'" color="primary" (click)="save()" [disabled]="saving()">
    {{ isEdit ? 'Lưu' : 'Tạo' }}
  </button>
</mat-dialog-actions>
