<mat-card class="auth-card" appearance="outlined">
  <h2>Quên mật khẩu</h2>
  <p class="lead">Nhập email, hệ thống sẽ gửi liên kết đặt lại mật khẩu tới hộp thư của bạn.</p>

  @if (errorMsg()) {
    <div class="alert"><mat-icon>error_outline</mat-icon><span>{{ errorMsg() }}</span></div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline" class="full">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" />
      <mat-icon matPrefix>mail</mat-icon>
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <mat-error>Email không hợp lệ</mat-error>
      }
    </mat-form-field>

    <button [matButton]="'filled'" color="primary" class="submit" type="submit" [disabled]="loading()">
      @if (loading()) { <mat-spinner diameter="20"></mat-spinner> } @else { <span>Gửi liên kết đặt lại</span> }
    </button>
  </form>

  <a class="back-link" routerLink="/login"><mat-icon>arrow_back</mat-icon> Quay lại đăng nhập</a>
</mat-card>
