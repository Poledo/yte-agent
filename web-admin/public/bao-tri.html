<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ thống đang được nâng cấp — ZeroCheck AI</title>
<style>
  /* Trang bảo trì TỰ CHỨA 100% (không tải font/ảnh ngoài) — phục vụ khi server sập */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05070f;
    color: #e7ecf6;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background-image:
      radial-gradient(700px 400px at 15% -5%, rgba(34, 211, 238, 0.10), transparent 60%),
      radial-gradient(700px 450px at 90% 105%, rgba(167, 139, 250, 0.10), transparent 60%);
  }
  .card {
    text-align: center;
    padding: 48px 36px;
    max-width: 460px;
  }
  .bot {
    font-size: 76px;
    display: inline-block;
    animation: float 3.2s ease-in-out infinite;
    filter: drop-shadow(0 0 22px rgba(34, 211, 238, 0.4));
  }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  h1 {
    margin: 18px 0 10px;
    font-size: 24px;
    background: linear-gradient(92deg, #22d3ee, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p { color: #9aa7c2; font-size: 15px; line-height: 1.65; }
  .bar {
    margin: 26px auto 10px;
    width: 240px;
    height: 5px;
    border-radius: 999px;
    background: rgba(148, 163, 184, 0.18);
    overflow: hidden;
  }
  .bar i {
    display: block;
    height: 100%;
    width: 40%;
    border-radius: 999px;
    background: linear-gradient(90deg, #22d3ee, #a78bfa);
    animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  .retry { font-size: 13px; color: #6b7a99; }
  button {
    margin-top: 18px;
    padding: 10px 26px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(100deg, #0e7490, #7c3aed);
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.15); }
</style>
</head>
<body>
  <div class="card">
    <span class="bot">🤖</span>
    <h1>Hệ thống đang được nâng cấp</h1>
    <p>ZeroCheck AI đang cập nhật phiên bản mới hoặc bảo trì ngắn.<br>
       Thường chỉ mất <b>1–3 phút</b> — trang sẽ tự kết nối lại.</p>
    <div class="bar"><i></i></div>
    <p class="retry">Tự thử lại sau <span id="cd">10</span> giây…</p>
    <button onclick="location.reload()">Thử lại ngay</button>
  </div>
  <script>
    // Đếm ngược rồi kiểm tra server: sống lại là quay về trang chính ngay
    var seconds = 10;
    var cd = document.getElementById('cd');
    setInterval(function () {
      seconds--;
      if (seconds <= 0) {
        seconds = 10;
        fetch('/', { cache: 'no-store' })
          .then(function (r) { if (r.ok) location.replace('/'); })
          .catch(function () { /* vẫn sập — chờ vòng sau */ });
      }
      cd.textContent = seconds;
    }, 1000);
  </script>
</body>
</html>
