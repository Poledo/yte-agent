# Dependabot tự mở PR khi thư viện có bản vá bảo mật hoặc bản mới.
# PR đi qua đúng CI như mọi thay đổi khác (job test chặn trước build-and-deploy).
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      # Toàn bộ gói @angular/* phải cùng phiên bản, nâng lẻ là gãy build.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'ng-packagr'
    commit-message:
      prefix: 'npm'

  # Ảnh nền node/nginx trong Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Asia/Ho_Chi_Minh
    commit-message:
      prefix: 'docker'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
