# Bản sao dùng riêng cho ĐO TẢI trên cụm K8s (namespace cbyts-loadtest).
#
# Vì sao có file này: BTC yêu cầu số đo hiệu năng chạy trên cụm K8s chứ không chỉ
# trên máy dev. Đội KHÔNG bắn tải vào namespace "cbyts" đang phục vụ thật, nên
# dựng một bản sao đầy đủ (API + PostgreSQL riêng) trong namespace tách biệt, đo
# xong thì xóa nguyên namespace. Cùng image, cùng resources limits như production
# nên con số đo được phản ánh đúng năng lực một pod trên cụm.
#
# Khác production ở 3 điểm, đều là cố ý:
#   1. Lưu trữ dùng emptyDir thay vì PVC — namespace này dùng xong là xóa.
#   2. PostgreSQL rỗng (EF migrations tự tạo schema lúc khởi động). Đường đo
#      POST /api/xml130/validate?useAi=false chạy hoàn toàn bằng đặc tả trường
#      + danh mục ICD nằm trong image, không đọc CSDL, nên dữ liệu rỗng không
#      ảnh hưởng kết quả đo.
#   3. initContainer ghi sẵn Storage/ratelimit-settings.json nâng ngưỡng chống
#      spam lên 1.000.000 req/phút/IP — nếu để mặc định 100 req/phút thì phép đo
#      chỉ đo được bộ chống spam chứ không đo được bộ máy luật.
#
# Cách dựng (xem thêm k8s/loadtest/README.md):
#   kubectl create ns cbyts-loadtest
#   kubectl -n cbyts get secret ecr-pull -o json | ... | kubectl -n cbyts-loadtest apply -f -
#   kubectl apply -f k8s/loadtest/cbyts-loadtest.yaml
#
# Dọn sạch sau khi đo:
#   kubectl delete ns cbyts-loadtest
apiVersion: v1
kind: Namespace
metadata:
  name: cbyts-loadtest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cbyts-loadtest
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: hackathon_ai
            - name: POSTGRES_USER
              value: postgres
            # KHÔNG đặt mật khẩu: CSDL này chỉ sống trong namespace đo tải, chỉ nghe
            # ClusterIP, dùng xong xóa cả namespace. Đặt mật khẩu ở đây đồng nghĩa
            # phải nhét một bí mật vào manifest — thứ mà chính đợt rà soát này yêu
            # cầu loại bỏ. Dùng trust auth là lựa chọn sạch hơn cho môi trường vứt đi.
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "hackathon_ai"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cbyts-loadtest
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-validation
  namespace: cbyts-loadtest
  labels:
    app: api-validation
spec:
  replicas: 1                 # giữ đúng 1 replica như production để so sánh được
  selector:
    matchLabels:
      app: api-validation
  template:
    metadata:
      labels:
        app: api-validation
    spec:
      imagePullSecrets:
        - name: ecr-pull
      initContainers:
        # Nâng ngưỡng chống spam để phép đo không đụng trần 100 req/phút/IP.
        - name: nang-nguong-chong-spam
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cat > /app/Storage/ratelimit-settings.json <<'JSON'
              {
                "GlobalPerMinute": 1000000,
                "LoginPerMinute": 5,
                "ForgotPasswordPerMinute": 3,
                "AskPerMinute": 1000000,
                "ImportPerMinute": 1000000
              }
              JSON
          volumeMounts:
            - name: storage
              mountPath: /app/Storage
      containers:
        - name: api-validation
          image: ecr.vnptplatform.vn/ecr_ekt75m5quci/api-validation:ecd6c255
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            # Không có mật khẩu vì PostgreSQL của namespace này chạy trust auth.
            - name: ConnectionStrings__KnowledgeDatabase
              value: Host=postgres;Port=5432;Database=hackathon_ai;Username=postgres
          volumeMounts:
            - name: storage
              mountPath: /app/Storage
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"          # giống production: trần 1 CPU cho mỗi pod
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-validation
  namespace: cbyts-loadtest
spec:
  type: ClusterIP
  selector:
    app: api-validation
  ports:
    - port: 8080
      targetPort: 8080
