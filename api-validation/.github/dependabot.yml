# Dependabot tự mở PR khi thư viện có bản vá bảo mật hoặc bản mới.
# Gom theo tuần để không ngập PR; PR đi qua đúng CI như mọi thay đổi khác
# (job test chặn trước build-and-deploy) nên bản nâng làm đỏ test sẽ không merge được.
version: 2

updates:
  # Gói NuGet của API và của project test.
  - package-ecosystem: nuget
    directories:
      - /AIValidation.Api
      - /AIValidation.Tests
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      # Các gói Microsoft.* / EF Core lên phiên bản cùng nhịp — gom một PR
      # thay vì mỗi gói một PR rồi xung đột phiên bản.
      microsoft:
        patterns:
          - 'Microsoft.*'
          - 'System.*'
    commit-message:
      prefix: 'nuget'

  # Ảnh nền trong Dockerfile (SDK/runtime .NET) — bản vá CVE của ảnh nền
  # thường là đường vá nhanh nhất cho lỗ hổng hệ điều hành.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Asia/Ho_Chi_Minh
    commit-message:
      prefix: 'docker'

  # Chính các action dùng trong workflow (checkout, setup-dotnet...).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
