# Quét lộ bí mật (secret scanning) bằng gitleaks.
#
# Quét cây thư mục làm việc (lệnh `gitleaks dir`), tức là NỘI DUNG SẼ ĐƯỢC MERGE —
# mục tiêu là chặn key/mật khẩu mới lọt vào master, không phải rà lại lịch sử cũ.
# Lịch sử git được xử lý riêng (xem docs/PERFORMANCE-SECURITY.md, mục Quản lý bí mật).
#
# Không gắn vào workflow deploy: đây là cổng chất lượng chạy song song, kết quả
# hiện ngay trên tab Actions và trên mỗi pull request.
name: Quét bí mật

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Quét lại hằng tuần kể cả khi không ai push — luật phát hiện của gitleaks
    # được cập nhật theo thời gian.
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dùng image chính chủ, ghim phiên bản để kết quả không đổi theo ngày.
      # Thoát khác 0 khi tìm thấy bí mật -> job đỏ.
      - name: Quét thư mục làm việc
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            dir /repo --redact --no-banner --verbose
